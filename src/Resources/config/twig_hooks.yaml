sylius_twig_hooks:
  hooks:
    # Orders of a transporter (route arobases_sylius_transporter_label_generation_plugin_admin_transporter_show)
    'arobases_sylius_transporter_label_generation_plugin.admin.transporter_order.index.content.header':
      breadcrumbs:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/TransporterOrder/Index/_breadcrumb.html.twig'
        priority: 100

    'arobases_sylius_transporter_label_generation_plugin.admin.transporter_order.index.content.header.title_block':
      title:
        template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
        configuration:
          title: arobases_sylius_transporter_label_generation_plugin.ui.colissimo
          icon: tabler:truck-delivery
        priority: 100

    'arobases_sylius_transporter_label_generation_plugin.admin.transporter_order.index#stylesheets':
      styles:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/_stylesheets.html.twig'

    'arobases_sylius_transporter_label_generation_plugin.admin.transporter_order.index#javascripts':
      scripts:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/TransporterOrder/_javascripts.html.twig'

    # Pickup point selection (route arobases_sylius_transporter_label_generation_plugin_render_pickup_point_map)
    'arobases_sylius_transporter_label_generation_plugin.admin.pickup_point':
      sidebar:
        template: '@SyliusAdmin/shared/crud/common/sidebar.html.twig'
        priority: 200
      navbar:
        template: '@SyliusAdmin/shared/crud/common/navbar.html.twig'
        priority: 100
      content:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/PickupPoint/content.html.twig'
        priority: 0

    # HS code field of the product form (rendered only when the application adds "hsCode" to ProductType)
    'sylius_admin.product.create.content.form.sections.general':
      hs_code:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/Product/_hs_code.html.twig'
        priority: 350

    'sylius_admin.product.update.content.form.sections.general':
      hs_code:
        template: '@ArobasesSyliusTransporterLabelGenerationPlugin/Admin/Product/_hs_code.html.twig'
        priority: 350
